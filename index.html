<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Vibe Fit | فايب فيت</title>
<meta name="description" content="Vibe Fit — تتبع تمارين المقاومة والديدلفت والمشي والسعرات مع لوحة تنافس يومية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap">
<script>document.documentElement.setAttribute('lang','ar');document.documentElement.setAttribute('dir','rtl');</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  if (window.tailwind) tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Tajawal', 'Cairo', 'system-ui', 'Segoe UI', 'Tahoma', 'sans-serif'],
          display: ['Cairo', 'Tajawal', 'system-ui', 'Segoe UI', 'Tahoma', 'sans-serif'],
          num: ['Archivo', 'Cairo', 'system-ui', 'sans-serif']
        }
      }
    }
  };
</script>
<style>
  /* Layout: sticky white header · right-hand rail of training pages (RTL) · one main column.
     Scoreboard numerals in condensed Archivo against Cairo (display) / Tajawal (text).
     Palette: white + slate greys only — charcoal buttons with white text, and the reverse. */
  :root {
    --paper: #F8FAFC;
    --card: #FFFFFF;
    --line: #E2E8F0;
    --line-2: #CBD5E1;
    --mute: #94A3B8;
    --ink-2: #475569;
    --ink: #1E293B;
    --ink-0: #0F172A;
    --on-ink: #FFFFFF;
    --f-body: 'Tajawal', 'Cairo', system-ui, 'Segoe UI', Tahoma, sans-serif;
    --f-display: 'Cairo', 'Tajawal', system-ui, 'Segoe UI', Tahoma, sans-serif;
    --f-num: 'Archivo', 'Cairo', system-ui, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  html { background: var(--paper); }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 60;
    background: var(--card);
  }
  .gutter {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .font-display { font-family: var(--f-display); }
  .num { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-stretch: 86%; }
  .wordmark { font-family: var(--f-num); font-stretch: 118%; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
  h1, h2, h3 { text-wrap: balance; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  input, select, button { font: inherit; }

  .inp {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0 .8rem;
    color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
  }
  .inp:hover { border-color: var(--line-2); }
  .inp:focus { outline: none; border-color: var(--ink-2); box-shadow: 0 0 0 3px rgba(148, 163, 184, .28); }
  .inp::placeholder { color: var(--mute); }
  .inp:-webkit-autofill, .inp:-webkit-autofill:hover, .inp:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--ink);
    -webkit-box-shadow: 0 0 0 1000px var(--card) inset;
    caret-color: var(--ink);
    transition: background-color 9999s ease-out 0s;
  }
  select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%); background-position: 18px 50%, 13px 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-left: 2rem; }
  .lbl { display: block; font-size: .75rem; font-weight: 700; color: var(--ink-2); margin-bottom: .35rem; }

  .btn-dark {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    background: var(--ink); color: var(--on-ink); font-weight: 700;
    border-radius: 12px; padding: 0 1.1rem; white-space: nowrap;
    transition: background .15s, transform .1s;
  }
  .btn-dark:hover { background: var(--ink-0); }
  .btn-dark:active { transform: translateY(1px); }
  .btn-ghost {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    font-weight: 700; border-radius: 12px; padding: 0 1rem; white-space: nowrap;
    transition: border-color .15s;
  }
  .btn-ghost:hover { border-color: var(--mute); }
  .chip {
    display: inline-flex; align-items: center; gap: .4rem; height: 2.1rem; padding: 0 .8rem;
    border-radius: 999px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink-2); font-size: .8125rem; font-weight: 700; white-space: nowrap;
    transition: border-color .15s, color .15s, background .15s;
  }
  .chip:hover { border-color: var(--mute); color: var(--ink); }
  .chip-on, .chip-on:hover { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .icon-btn { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; border-radius: 10px; color: var(--mute); flex-shrink: 0; }
  .icon-btn:hover { background: var(--paper); color: var(--ink); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 1rem; }
  .eyebrow { display: flex; align-items: center; gap: .5rem; font-size: .8rem; font-weight: 700; color: var(--ink-2); margin-bottom: .3rem; }
  .eyebrow::before { content: ""; width: 18px; height: 2px; border-radius: 2px; background: var(--ink); }
  .seg {
    display: inline-flex; align-items: center; gap: .5rem; height: 2.6rem; padding: 0 1rem;
    border-radius: .85rem; font-weight: 700; font-size: .875rem; color: var(--ink-2);
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .seg:hover { color: var(--ink); }
  .seg-on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(15, 23, 42, .08), 0 6px 14px -8px rgba(15, 23, 42, .25); }
  .rtl-flip { transform: scaleX(-1); }
  input[type="range"] { accent-color: var(--ink); width: 100%; height: 1.5rem; }
  .void-bg {
    background:
      repeating-radial-gradient(circle at 30% 38%, transparent 0 54px, rgba(148, 163, 184, .10) 54px 55px),
      var(--ink);
  }
  .podium-1 { background: var(--ink); color: var(--on-ink); }

  #toasts {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
    display: flex; flex-direction: column; align-items: center; gap: .5rem;
    pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .toast {
    pointer-events: auto; display: flex; align-items: center; gap: .75rem;
    width: min(420px, 100%); background: var(--ink); color: var(--on-ink);
    border-radius: 16px; padding: .75rem 1rem;
    box-shadow: 0 18px 40px -16px rgba(15, 23, 42, .55);
    animation: toast-in .28s cubic-bezier(.2, .8, .2, 1) both;
  }
  .toast .ic { width: 30px; height: 30px; border-radius: 999px; background: rgba(255, 255, 255, .12); display: grid; place-items: center; flex-shrink: 0; }
  .toast .t1 { font-weight: 700; line-height: 1.35; }
  .toast .t2 { font-size: .8rem; color: var(--line-2); line-height: 1.4; }
  .toast.err { background: var(--card); color: var(--ink); border: 1px solid var(--line-2); }
  .toast.err .ic { background: var(--paper); }
  .toast.err .t2 { color: var(--ink-2); }
  .toast.out { animation: toast-out .22s ease-in both; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }
  .modal-card { animation: modal-in .24s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes modal-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .fade-in { animation: fade-in .3s ease-out both; }
  @keyframes fade-in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  /* ---- set-by-set logging ---- */
  .ex-thumb { position: relative; width: 60px; height: 60px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); display: grid; place-items: center; flex-shrink: 0; transition: border-color .15s, transform .15s, box-shadow .15s; }
  .ex-thumb.is-anim { width: 84px; height: 76px; padding: 2px; overflow: hidden; background: linear-gradient(180deg, #F1F5F9, #FFFFFF); }
  .ex-thumb:hover { border-color: var(--mute); transform: translateY(-1px); box-shadow: 0 8px 18px -12px rgba(15, 23, 42, .35); }
  .ex-play { position: absolute; bottom: 4px; left: 4px; width: 18px; height: 18px; border-radius: 999px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; box-shadow: 0 2px 6px rgba(15, 23, 42, .25); }
  .ex-bob { animation: ic-lift 2.4s ease-in-out infinite; }
  .live-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--ink); animation: ai-pulse 1.4s ease-in-out infinite; }
  .btn-text { display: inline-flex; align-items: center; gap: .35rem; height: 2.25rem; padding: 0 .6rem; border-radius: 10px; font-weight: 700; font-size: .875rem; color: var(--ink); }
  .btn-text:hover { background: var(--paper); }
  .set-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) minmax(0, 1fr) 46px; gap: 6px; align-items: center; padding: 5px; border-radius: 18px; border: 1.5px solid transparent; transition: background .2s, border-color .2s; }
  .set-row.is-next { border-color: var(--ink); }
  .set-row.is-done { background: var(--paper); }
  .set-no { font-size: 14px; font-weight: 800; color: var(--mute); text-align: center; }
  .is-done .set-no { color: var(--ink); }
  .stepper { position: relative; display: flex; align-items: center; height: 52px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); min-width: 0; }
  .is-done .stepper { background: var(--card); }
  .stepper button { width: 32px; height: 100%; flex-shrink: 0; display: grid; place-items: center; font-size: 22px; font-weight: 600; color: var(--ink-2); border-radius: 13px; transition: background .12s, transform .08s; }
  .stepper button:hover { background: rgba(148, 163, 184, .18); color: var(--ink); }
  .stepper button:active { transform: scale(.9); }
  .stepper .val { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .stepper input, .stepper .sv { width: 100%; text-align: center; background: transparent; border: 0; padding: 0; color: var(--ink); font-family: var(--f-num); font-weight: 800; font-size: 22px; font-stretch: 86%; font-variant-numeric: tabular-nums; }
  .stepper input:focus { outline: none; }
  .stepper:focus-within { border-color: var(--ink-2); box-shadow: 0 0 0 3px rgba(148, 163, 184, .25); }
  .stepper .unit { margin-top: 3px; font-size: 10.5px; font-weight: 700; color: var(--mute); }
  .stepper.is-static { justify-content: center; }
  .set-check { width: 44px; height: 44px; justify-self: center; border-radius: 999px; border: 2px solid var(--line-2); display: grid; place-items: center; color: transparent; transition: background .2s, border-color .2s, color .2s; }
  .set-check:hover { border-color: var(--ink-2); color: var(--line-2); }
  .is-done .set-check { background: var(--ink); border-color: var(--ink); color: var(--on-ink); animation: check-pop .35s cubic-bezier(.2, 1.6, .4, 1); }
  .hype-pop { position: absolute; left: 0; right: 0; top: -4px; text-align: center; font-size: 11.5px; font-weight: 800; color: var(--ink); white-space: nowrap; pointer-events: none; animation: pop-up 1.2s ease-out forwards; }
  @media (max-width: 400px) {
    .stepper button { width: 27px; font-size: 20px; }
    .stepper input, .stepper .sv { font-size: 19px; }
    .set-row { grid-template-columns: 16px minmax(0, 1fr) minmax(0, 1fr) 42px; gap: 5px; padding: 4px; }
    .set-check { width: 40px; height: 40px; }
  }
  /* ---- session bar ---- */
  .sbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: rgba(255, 255, 255, .97); backdrop-filter: blur(10px); border-top: 1px solid var(--line); box-shadow: 0 -12px 30px -18px rgba(15, 23, 42, .35); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); animation: bar-in .3s cubic-bezier(.2, .8, .2, 1) both; }
  .sbar-in { max-width: 56rem; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  body.has-bar #toasts { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
  /* ---- celebration ---- */
  .hype { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden; cursor: pointer; text-align: center;
    background: radial-gradient(120% 90% at 50% 42%, rgba(51, 65, 85, .95) 0%, rgba(15, 23, 42, .97) 55%, rgba(2, 6, 23, .985) 100%);
    padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    animation: hype-in .2s ease-out both; }
  .hype::before { content: ""; position: absolute; inset: 0; background: #FFFFFF; opacity: 0; pointer-events: none; animation: hype-flash .5s ease-out .05s both; }
  .hype canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hype-rings i { position: absolute; left: 50%; top: 44%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .6); opacity: 0; animation: hype-ring 1.15s cubic-bezier(.1, .6, .3, 1) both; }
  .hype-rings i:nth-child(2) { animation-delay: .12s; }
  .hype-rings i:nth-child(3) { animation-delay: .24s; }
  .hype-core { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; color: #FFFFFF; max-width: 100%; }
  .hype-emoji { font-size: clamp(64px, 17vw, 136px); line-height: 1; filter: drop-shadow(0 12px 30px rgba(0, 0, 0, .5)); animation: hype-emoji .7s cubic-bezier(.2, 1.5, .4, 1) .08s both, hype-bob 1.6s ease-in-out .8s infinite; }
  .hype-word { position: relative; font-family: var(--f-num); font-weight: 900; font-stretch: 125%; font-size: clamp(70px, 21vw, 250px); line-height: .86; color: #FFFFFF; text-shadow: 0 0 34px rgba(255, 255, 255, .35), 0 8px 0 rgba(15, 23, 42, .55); animation: hype-slam .62s cubic-bezier(.16, 1.3, .3, 1) .1s both; }
  .hype-word.ar { font-family: var(--f-display); font-stretch: 100%; font-size: clamp(58px, 17vw, 168px); line-height: 1.15; }
  .hype-word::before, .hype-word::after { content: attr(data-text); position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .hype-word::before { color: #94A3B8; animation: hype-glitch-a .45s steps(2) .2s 3; }
  .hype-word::after { color: #E2E8F0; animation: hype-glitch-b .45s steps(2) .2s 3; }
  .hype-sub { font-family: var(--f-display); font-weight: 800; font-size: clamp(22px, 5.6vw, 36px); line-height: 1.3; animation: hype-rise .5s ease-out .45s both; }
  .hype-detail { display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .5rem; max-width: 100%; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .2); border-radius: 999px; padding: .5rem 1rem; font-size: 15px; font-weight: 700; animation: hype-rise .5s ease-out .6s both; }
  .hype-plus { background: #FFFFFF; color: #0F172A; border-radius: 999px; padding: .1rem .6rem; font-weight: 900; }
  .hype-tag { font-family: var(--f-num); font-size: 13px; font-weight: 800; letter-spacing: .14em; color: #CBD5E1; animation: hype-rise .5s ease-out .75s both; }
  .hype-tap { position: absolute; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: #94A3B8; animation: hype-rise .4s ease-out 1.1s both; }
  .hype.out { animation: hype-out .26s ease-in forwards; }
  .shake { animation: shake .55s cubic-bezier(.36, .07, .19, .97) both; }
  @keyframes hype-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes hype-out { to { opacity: 0; transform: scale(1.04); } }
  @keyframes hype-flash { 0% { opacity: .85; } 100% { opacity: 0; } }
  @keyframes hype-ring { 0% { opacity: .9; transform: scale(.2); } 100% { opacity: 0; transform: scale(7.5); } }
  @keyframes hype-slam { 0% { opacity: 0; transform: scale(3.2) rotate(-7deg); filter: blur(14px); } 55% { opacity: 1; transform: scale(.92) rotate(1deg); filter: blur(0); } 75% { transform: scale(1.05); } 100% { opacity: 1; transform: none; } }
  @keyframes hype-emoji { 0% { opacity: 0; transform: translateY(40px) scale(.3) rotate(-25deg); } 100% { opacity: 1; transform: none; } }
  @keyframes hype-bob { 50% { transform: translateY(-8px) rotate(5deg); } }
  @keyframes hype-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes hype-glitch-a { 0% { opacity: .85; transform: translate(-7px, 2px); } 50% { transform: translate(5px, -3px); } 100% { opacity: 0; transform: none; } }
  @keyframes hype-glitch-b { 0% { opacity: .85; transform: translate(7px, -2px); } 50% { transform: translate(-4px, 3px); } 100% { opacity: 0; transform: none; } }
  @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-9px, 2px, 0); } 40%, 60% { transform: translate3d(9px, -2px, 0); } }
  @keyframes check-pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
  @keyframes pop-up { 0% { opacity: 0; transform: translateY(6px) scale(.85); } 18% { opacity: 1; transform: translateY(-16px) scale(1.05); } 100% { opacity: 0; transform: translateY(-36px); } }
  @keyframes bar-in { from { transform: translateY(100%); } to { transform: none; } }
  /* ---- AI meal calculator ---- */
  .ai-scan { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15, 23, 42, .28), rgba(15, 23, 42, .05) 35%, rgba(255, 255, 255, .7) 50%, rgba(15, 23, 42, .05) 65%, rgba(15, 23, 42, .28)); background-size: 100% 260%; animation: ai-scan 1.5s ease-in-out infinite alternate; }
  .ai-skel { border-radius: 8px; background: linear-gradient(90deg, var(--line) 0%, var(--paper) 50%, var(--line) 100%); background-size: 200% 100%; animation: ai-shimmer 1.2s linear infinite; }
  .ai-dot { width: 10px; height: 10px; border-radius: 999px; background: var(--ink); animation: ai-pulse 1s ease-in-out infinite; }
  @keyframes ai-scan { from { background-position: 0 0%; } to { background-position: 0 100%; } }
  @keyframes ai-shimmer { to { background-position: -200% 0; } }
  @keyframes ai-pulse { 50% { transform: scale(.5); opacity: .4; } }
  /* ---- training programs ---- */
  .btn-dark:disabled { background: var(--line-2); cursor: not-allowed; }
  .btn-light { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; background: #FFFFFF; color: var(--ink); font-weight: 800; border-radius: 12px; padding: 0 1.1rem; white-space: nowrap; transition: background .15s, transform .1s; }
  .btn-light:hover { background: var(--line); }
  .btn-light:active { transform: translateY(1px); }
  .tag-dark { flex-shrink: 0; font-size: 11px; font-weight: 800; color: var(--on-ink); background: var(--ink); border-radius: 999px; padding: .2rem .65rem; white-space: nowrap; }
  .wz-opt { position: relative; display: flex; align-items: center; gap: .9rem; width: 100%; text-align: start; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: .85rem 1rem; padding-inline-end: 2.9rem; transition: border-color .15s, background .15s, box-shadow .15s, transform .1s; }
  .wz-opt:hover { border-color: var(--mute); }
  .wz-opt:active, .wz-mus:active, .wz-num:active { transform: scale(.985); }
  .wz-opt[aria-pressed="true"], .wz-mus[aria-pressed="true"] { border-color: var(--ink); background: var(--paper); box-shadow: inset 0 0 0 1px var(--ink); }
  .wz-check { position: absolute; top: 50%; inset-inline-end: 12px; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: transparent; background: var(--card); transition: background .15s, border-color .15s, color .15s; }
  [aria-pressed="true"] > .wz-check { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .wz-ic { width: 54px; height: 54px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); display: grid; place-items: center; flex-shrink: 0; color: var(--ink); }
  [aria-pressed="true"] > .wz-ic { background: var(--card); }

  /* =========================================================
     Calculations
     ========================================================= */
  // Energy cost of moving, as gross metabolic rate in W/kg.
  // Walking: LCDA equation (Looney et al., Med Sci Sports Exerc 2019; 51:1954), accurate from slow to
  //   fast walking and on grades:  M = 1.44 + 1.94·S^0.43 + 0.24·S^4 + 0.34·S·G·(1 − 1.05^(1 − 1.1^(G+32)))
  //   (S in m/s, G = grade in %). ACSM's walking line underestimates brisk walking (at 7 km/h by ~40%).
  // Running (from 8 km/h): ACSM  VO2 = 0.2·S + 0.9·S·G + 3.5  (S in m/min, G as a fraction), 5 kcal per litre O2.
  // The two meet at 8 km/h, so the switch has no jump.
  const WKG_PER_VO2 = 5 * 4184 / 1000 / 60;        // ml O2/kg/min → W/kg at 5 kcal per litre
  function moveCost(speedKmh, inclinePct) {
    const G = Math.max(0, inclinePct || 0);
    if (speedKmh >= RUN_FROM) {
      const mpm = speedKmh * 1000 / 60;
      const vo2 = 0.2 * mpm + 0.9 * mpm * G / 100 + 3.5;
      return { running: true, mpm, vo2, wkg: vo2 * WKG_PER_VO2 };
    }
    const S = speedKmh / 3.6;
    const gradeTerm = G > 0 ? 0.34 * S * G * (1 - Math.pow(1.05, 1 - Math.pow(1.1, G + 32))) : 0;
    const wkg = 1.44 + 1.94 * Math.pow(S, 0.43) + 0.24 * Math.pow(S, 4) + gradeTerm;
    return { running: false, S, gradeTerm, vo2: wkg / WKG_PER_VO2, wkg };
  }
  const paceStr = p => { if (!(p > 0) || !Number.isFinite(p)) return '—'; let m = Math.floor(p), s = Math.round((p - m) * 60); if (s === 60) { m += 1; s = 0; } return `${m}:${pad2(s)}`; };
  const bmr = p => { const b = 10 * p.weight + 6.25 * p.height - 5 * p.age; return p.sex === 'f' ? b - 161 : b + 5; };
  const tdee = p => bmr(p) * p.activity;
  const dailyTarget = p => tdee(p) + ((GOALS[p.goal] || GOALS.maintain).adj);
  const validProfile = p => p && p.age >= 10 && p.age <= 100 && p.height >= 100 && p.height <= 250 && p.weight >= 25 && p.weight <= 300 && p.activity > 0;
  const epley = (w, r) => r <= 1 ? w : w * (1 + r / 30);
  // Step length: about 41.5% of height when walking; a run (cadence 160+ steps/min) is about 65%.
  const strideM = (heightCm, cadence) => {
    const walk = (heightCm || 170) * 0.415 / 100, run = (heightCm || 170) * 0.65 / 100;
    const t = clamp(((cadence || 100) - 135) / 25, 0, 1);
    return walk + (run - walk) * t;
  };

  function dayStats(u, date) {
    const kinds = {}; u.pages.forEach(p => { kinds[p.id] = p.kind; });
    const logs = u.logs.filter(l => l.date === date);
    let reps = 0, sets = 0, volume = 0, dlTop = 0, resTop = 0;
    logs.forEach(l => {
      const r = l.sets * l.reps, w = l.weight || 0;
      reps += r; sets += l.sets; volume += r * w;
      if (kinds[l.pageId] === 'deadlift') dlTop = Math.max(dlTop, w); else resTop = Math.max(resTop, w);
    });
    const prevDl = u.logs.reduce((m, l) => (l.date < date && kinds[l.pageId] === 'deadlift') ? Math.max(m, l.weight || 0) : m, 0);
    const pr = dlTop > 0 && prevDl > 0 && dlTop > prevDl;
    const cardio = u.cardio.filter(c => c.date === date);
    const walkMin = sum(cardio, c => c.minutes);
    const cardioKcal = sum(cardio, c => c.kcal);
    const distance = sum(cardio, c => c.distance);
    const tm = cardio.filter(c => c.mode === 'treadmill');
    const tmMin = sum(tm, c => c.minutes);
    const tmSpeed = tmMin ? sum(tm, c => c.speed * c.minutes) / tmMin : 0;
    const tmIncline = maxOf(tm, c => c.incline);
    const wt = (u.profile && u.profile.weight) || 75;
    const liftKcal = LIFT_MET * 3.5 * wt / 200 * sets * MIN_PER_SET;
    const eaten = sum(u.meals.filter(m => m.date === date), m => m.kcal);
    const pts = {
      reps: reps * SCORE.perRep,
      volume: volume / SCORE.volumePer,
      cardio: walkMin * SCORE.perCardioMin,
      burn: cardioKcal / SCORE.kcalPer,
      pr: pr ? SCORE.prBonus : 0
    };
    const score = Math.round(pts.reps + pts.volume + pts.cardio + pts.burn + pts.pr);
    return { reps, sets, volume, dlTop, resTop, pr, prevDl, walkMin, cardioKcal, distance, tmMin, tmSpeed, tmIncline, liftKcal, burnTotal: cardioKcal + liftKcal, eaten, pts, score, exercises: new Set(logs.map(l => l.exId)).size };
  }

  function rankingView(active, meKey, maxScore) {

  /* =========================================================

  function workoutView(u, page) {
    const d = today();

    const kindLabel = page.kind === 'resistance' ? 'صفحة أساسية · مقاومة' : page.kind === 'deadlift' ? 'صفحة أساسية · ديدلفت' : page.prog ? `برنامج · ${esc((getProg(u, page.prog) || {}).name || '')}` : 'صفحة مخصصة';

      : `<button data-act="ask-confirm" data-key="page:${page.id}" class="btn-ghost h-10 text-sm text-slate-600">${icon('trash', 'w-4 h-4')} حذف الصفحة</button>`);
    const existing = new Set(page.exercises.map(e => e.name));
    const sugg = (SUGGEST[page.kind] || SUGGEST.custom).filter(s => !existing.has(s)).slice(0, 6);
    const anyDone = page.exercises.some(ex => doneToday(u, ex).length);

      <button data-act="sound-toggle" class="btn-ghost h-10 text-sm text-slate-600" aria-pressed="${sound}" title="أصوات الاحتفال والمؤقت">${icon(sound ? 'vol' : 'mute', 'w-4 h-4')} ${sound ? 'الصوت يعمل' : 'الصوت مغلق'}</button>
      ${side}
    </div>`;

    return `<section class="space-y-6 fade-in">
      ${pageHeader(kindLabel, esc(page.name), page.desc ? esc(page.desc) : '', sideBtns)}

        : `<div class="card p-8 text-center"><p class="font-display font-bold text-slate-800">لا توجد تمارين في هذه الصفحة بعد</p><p class="text-sm text-slate-500 mt-1">أضف أول تمرين بالاسم من الحقل أدناه أو اختر من الاقتراحات.</p></div>`}

    </section>`;

  // Deadlift-specific: PR, estimated 1RM, progression chart, plate calculator
  function deadliftPanel(u, page) {
    const logs = u.logs.filter(l => l.pageId === page.id && l.weight > 0);

    logs.forEach(l => { byDate[l.date] = Math.max(byDate[l.date] || 0, l.weight); });
    const series = Object.keys(byDate).sort().slice(-10).map(d => ({ d, v: byDate[d] }));
    const prLog = logs.slice().sort((a, b) => b.weight - a.weight || a.ts - b.ts)[0];
    const best1rm = logs.filter(l => l.reps <= 10).reduce((m, l) => Math.max(m, epley(l.weight, l.reps)), 0);
    const exName = prLog ? (page.exercises.find(e => e.id === prLog.exId) || {}).name || '' : '';
    if (ui.plateW == null) ui.plateW = prLog ? String(prLog.weight) : '100';

      <div class="card p-4 sm:p-5">
        <div class="flex flex-wrap items-baseline justify-between gap-2">

            <p class="mt-1"><span class="num text-3xl font-extrabold">${prLog ? fmt(prLog.weight, 2) : '—'}</span> <span class="text-xs text-slate-300">${prLog ? 'كجم' : ''}</span></p>
            <p class="text-[11px] text-slate-400 mt-0.5 leading-4">${prLog ? `${esc(exName)} · ${shortDate(prLog.date)}` : 'سجّل أول جلسة'}</p>
          </div>
          <div class="rounded-2xl bg-white border border-slate-200 p-4">
            <p class="text-xs font-bold text-slate-500"><span dir="ltr">1RM</span> التقديري</p>
            <p class="mt-1"><span class="num text-3xl font-extrabold text-slate-900">${best1rm ? fmt(best1rm, 1) : '—'}</span> <span class="text-xs text-slate-400">${best1rm ? 'كجم' : ''}</span></p>
            <p class="text-[11px] text-slate-400 mt-0.5 leading-4">بمعادلة <span dir="ltr">Epley</span> من أفضل جلساتك</p>
          </div>
        </div>
        <div class="card p-4">
          <div class="flex items-center justify-between gap-3">
            <label for="plate-w" class="font-display font-bold text-slate-900">حاسبة الأقراص</label>
            <span class="text-[11px] text-slate-400">بار أولمبي <span class="num">${BAR_KG}</span> كجم</span>
          </div>
          <div class="mt-2 flex flex-wrap items-center gap-2">
            <input id="plate-w" class="inp num h-10 text-center" style="width:7rem" inputmode="decimal" value="${esc(ui.plateW)}" aria-label="الوزن المستهدف بالكيلوجرام">
            <span class="text-sm text-slate-500">كجم على البار</span>
          </div>
          <div id="plate-out" class="mt-3">${platesHTML(num(ui.plateW))}</div>

    const count = {};
    page.exercises.forEach(ex => {
      const n = sum(doneToday(u, ex), l => l.sets);
      if (n) exMeta(ex).muscles.forEach(m => { count[m] = (count[m] || 0) + n; });

    const list = Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 8);

  // ---- set actions ----

  function toast(msg, sub = '', type = 'ok') {
    const box = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast' + (type === 'err' ? ' err' : '');
    el.setAttribute('role', type === 'err' ? 'alert' : 'status');
    el.innerHTML = `<span class="ic">${icon(type === 'err' ? 'info' : 'check', 'w-4 h-4')}</span><div class="min-w-0"><p class="t1">${esc(msg)}</p>${sub ? `<p class="t2">${esc(sub)}</p>` : ''}</div>`;
    box.appendChild(el);
    while (box.children.length > 3) box.firstElementChild.remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 240); }, type === 'err' ? 3600 : 2800);
  }

  // After Supabase accepts the password: load the shared board, then open this user's account.
  async function enterAs(user, isNew) {
    resetShared();
    authUid = user.id;
    fullLoad();
    startLive();
    const ok = await whenReady(20000);
    if (authUid !== user.id) return;
    if (!ok) {
      endSession();
      setAuthError('تعذّر تحميل لوحة التنافس. تحقق من الإنترنت وحاول مرة ثانية.');
      return;
    }
    const k = myKey();
    if (!k || !db.users[k]) {
      endSession();
      setAuthError('ما لقينا حسابك في اللوحة. أنشئ حساباً جديداً.');
      return;
    }
    startSession(db.users[k], isNew);

  async function doLogin(name, pass) {
    if (ui.authBusy || authNotReady()) return;
    const key = userKey(name);
    if (!key) return setAuthError('اكتب اسم المستخدم.');
    if (!pass) return setAuthError('اكتب كلمة المرور.');
    if (!(window.crypto && crypto.subtle)) return setAuthError('افتح الموقع من رابطه الآمن (https) عشان تسجّل دخولك.');
    setAuthError('');
    setAuthBusy(true);
    try {
      const pw = await loginPass(key, pass);
      const { data, error } = await sb.auth.signInWithPassword({ email: await loginEmail(key), password: pw });
      if (error || !data || !data.user) {
        if (isNetErr(error)) return setAuthError('تعذّر الاتصال بالخادم. تحقق من الإنترنت وحاول مرة ثانية.');
        if (error && error.status === 429) return setAuthError('محاولات كثيرة. انتظر دقيقة ثم حاول مرة ثانية.');
        let exists = true;
        try { const r = await sb.rpc('vf_name_exists', { k: key }); if (!r.error) exists = !!r.data; } catch (e) { /* keep the password message */ }
        return setAuthError(exists ? 'كلمة المرور غير صحيحة. حاول مرة أخرى.' : `لا يوجد حساب باسم «${name.trim()}». تأكد من الاسم أو أنشئ حساباً جديداً.`);
      }
      await enterAs(data.user, false);
    } catch (e) {
      setAuthError('تعذّر تسجيل الدخول الآن. حاول مرة ثانية.');
    } finally {
      setAuthBusy(false);
    }
  }
  async function doRegister(name, pass) {
    if (ui.authBusy || authNotReady()) return;
    const n = name.trim().replace(/\s+/g, ' ').slice(0, 30);
    if (!n) return setAuthError('اكتب اسم المستخدم.');
    if (!pass) return setAuthError('اكتب أي كلمة مرور.');
    if (!(window.crypto && crypto.subtle)) return setAuthError('افتح الموقع من رابطه الآمن (https) عشان تنشئ حسابك.');
    const key = userKey(n);
    setAuthError('');
    setAuthBusy(true);
    try {
      const pw = await loginPass(key, pass);
      const draft = makeUser(n, pass);
      let res, body = {};
      try {
        res = await fetch(SB_URL + '/functions/v1/vf-register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY },
          body: JSON.stringify({ username: n, password: pw, profile: draft.profile, pages: draft.pages })
        });
        body = await res.json().catch(() => ({}));
      } catch (e) {
        return setAuthError('تعذّر الاتصال بالخادم. تحقق من الإنترنت وحاول مرة ثانية.');
      }
      if (res.status === 409 || body.error === 'taken') return setAuthError(`اسم المستخدم «${n}» مستخدم بالفعل. اختر اسماً آخر أو سجّل الدخول.`);
      if (!res.ok) return setAuthError('تعذّر إنشاء الحساب الآن. حاول مرة ثانية بعد قليل.');
      const { data, error } = await sb.auth.signInWithPassword({ email: await loginEmail(key), password: pw });
      if (error || !data || !data.user) { return setAuthError('تم إنشاء حسابك، لكن تعذّر الدخول الآن. اضغط «تسجيل الدخول» وحاول مرة ثانية.'); }
      await enterAs(data.user, true);
    } catch (e) {
      setAuthError('تعذّر إنشاء الحساب الآن. حاول مرة ثانية بعد قليل.');
    } finally {
      setAuthBusy(false);
    }
  }

  function addExercise(u, pageId, rawName) {
    const page = u.pages.find(p => p.id === pageId); if (!page) return;
    const name = String(rawName || '').trim().replace(/\s+/g, ' ');
    if (!name) { toast('اكتب اسم التمرين أولاً', '', 'err'); return; }
    if (name.length > 40) { toast('اسم التمرين طويل', 'استخدم 40 حرفاً أو أقل.', 'err'); return; }
    if (page.exercises.some(e => e.name.toLowerCase() === name.toLowerCase())) { toast(`«${name}» موجود في هذه الصفحة`, '', 'err'); return; }
    page.exercises.unshift(mkEx(name));
    saveDB();
    renderApp();
    toast(`تمت إضافة تمرين «${name}»`, `في صفحة ${page.name}. سجّل جولاتك الآن.`);
  }
  function saveCardio(u) {
    const c = computeCardio(u);
    if (c.error) { toast('لا يمكن حفظ الجلسة', c.error, 'err'); return; }
    const entry = { id: uid(), date: today(), mode: c.mode, minutes: c.minutes, speed: Math.round(c.speed * 100) / 100, incline: c.incline, distance: Math.round(c.distance * 1000) / 1000, kcal: Math.round(c.kcal), ts: Date.now() };
    if (c.mode === 'outdoor') entry.steps = c.steps;
    u.cardio.push(entry);
    saveDB();
    renderApp();
    toast(c.mode === 'treadmill' ? 'تم حفظ جلسة السير الكهربائي' : 'تم حفظ جلسة المشي', `${fmt(c.minutes)} دقيقة · ${fmt(c.distance, 2)} كم · ${fmt(c.kcal)} سعرة · +${fmt(c.minutes * SCORE.perCardioMin + c.kcal / SCORE.kcalPer)} نقطة`);

  function addPage(u) {

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    const u = me();
    if (WRITE_ACTS.has(act) && !guardWrite()) return;
    switch (act) {
      case 'nav': if (u) { closeDrawer(true); setView(t.dataset.v); } break;
      case 'cbum-mus': ui.cbumMus = t.dataset.v; renderApp(); break;
      case 'cb-jump': { const el = document.getElementById(t.dataset.to); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
      case 'drawer-open': if (u) openDrawer(); break;
      case 'drawer-close': closeDrawer(); break;
      case 'auth-mode': {
        const nameEl = $('#au-name'); if (nameEl) ui.authName = nameEl.value;
        ui.authMode = t.dataset.mode; renderApp();
        const f = $('#au-name'); if (f) f.focus();
        break;
      }
      case 'toggle-pass': {
        ui.showPass = !ui.showPass;
        ['#au-pass', '#au-pass2'].forEach(s => { const el = $(s); if (el) el.type = ui.showPass ? 'text' : 'password'; });
        t.innerHTML = icon(ui.showPass ? 'eyeOff' : 'eye');
        t.setAttribute('aria-label', (ui.showPass ? 'إخفاء' : 'إظهار') + ' كلمة المرور');
        break;
      }
      case 'logout': logout(); break;
      case 'open-add-page': closeDrawer(true); openModal('add-page'); break;
      case 'close-modal': closeModal(); break;
      case 'modal-bg': if (e.target === t) closeModal(); break;
      case 'np-suggest': {
        const s = PAGE_SUGGEST[+t.dataset.i]; if (!s) break;
        $('#np-name').value = s.n; $('#np-ex').value = s.ex.join('، ');
        $('#np-err').textContent = '';
        break;
      }
      case 'ex-suggest': if (u) addExercise(u, t.dataset.page, t.dataset.name); break;
      case 'ask-confirm': ui.confirm = t.dataset.key; renderApp(); break;
      case 'cancel-confirm': ui.confirm = null; renderApp(); break;
      case 'del-ex': {
        if (!u) break;
        const page = u.pages.find(p => p.id === t.dataset.page);
        const ex = page && page.exercises.find(x => x.id === t.dataset.id);
        if (!ex) break;
        page.exercises = page.exercises.filter(x => x.id !== ex.id);
        u.logs = u.logs.filter(l => l.exId !== ex.id);
        ui.confirm = null; saveDB(); renderApp();
        toast(`حُذف تمرين «${ex.name}»`);
        break;
      }
      case 'del-page': {
        if (!u) break;
        const page = u.pages.find(p => p.id === t.dataset.id);
        if (!page || page.builtin || page.prog) break;
        u.pages = u.pages.filter(p => p.id !== page.id);
        u.logs = u.logs.filter(l => l.pageId !== page.id);
        saveDB();
        setView('board');
        toast(`حُذفت صفحة «${page.name}»`);
        break;
      }
      case 'del-log': {
        if (!u) break;

        ctx.lineCap = 'round';
        if (t < 0.95) {
          const k = Math.min(1, t / 0.92);
          inward.forEach(q => {
            const e = Math.pow(k, q.p), e0 = Math.pow(Math.max(0, k - 0.07), q.p);
            const r = q.r * (1 - e), r0 = q.r * (1 - e0), ang = q.a + e * q.sw, ang0 = q.a + e0 * q.sw;
            ctx.strokeStyle = `rgba(226, 232, 240, ${(Math.min(1, k * 2.5) * (0.2 + 0.7 * e)).toFixed(3)})`;
            ctx.lineWidth = q.w;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(ang0) * r0, cy + Math.sin(ang0) * r0);
            ctx.lineTo(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r);
            ctx.stroke();
          });
        }
        if (t > T_SNAP) {
          const appear = Math.min(1, (t - T_SNAP) / 0.45);
          const warp = Math.max(0, t - T_WARP);
          const speed = 120 + Math.pow(Math.min(1, warp / 0.6), 3) * 9000;      // depth units per second
          stars.forEach(st => {
            st.pz = st.z;
            st.z -= speed * dt;
            if (st.z < 4) { reset(st, DEPTH); return; }
            const sx = cx + st.x * F / st.z, sy = cy + st.y * F / st.z;
            if (sx < -60 || sx > W + 60 || sy < -60 || sy > H + 60) { reset(st, DEPTH); return; }
            const near = 1 - st.z / DEPTH;
            const a = appear * Math.min(1, 0.18 + near * 1.15) * (warp > 0 ? 1 : 0.6 + 0.4 * Math.sin(t * 6 + st.tw));
            if (warp > 0.015) {                                  // warp: each star streaks past from where it was
              ctx.strokeStyle = `rgba(241, 245, 249, ${a.toFixed(3)})`;
              ctx.lineWidth = st.r * (0.8 + near * 2.2);
              ctx.beginPath();
              ctx.moveTo(cx + st.x * F / st.pz, cy + st.y * F / st.pz);
              ctx.lineTo(sx, sy);
              ctx.stroke();
            } else {
              ctx.fillStyle = `rgba(241, 245, 249, ${a.toFixed(3)})`;
              ctx.beginPath();

      };

  }

    const lib = window.supabase;
    if (!lib || typeof lib.createClient !== 'function') { sharedStale = true; renderApp(); return; }

      sb = lib.createClient(SB_URL, SB_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'vibefit.auth.v1' }

      if (event === 'SIGNED_OUT' && authUid) setTimeout(() => { if (authUid) endSession('انتهت جلستك. سجّل دخولك من جديد.'); }, 0);
    });
    let session = null;
    try { const r = await sb.auth.getSession(); session = r && r.data ? r.data.session : null; } catch (e) { session = null; }
    mode = 'shared';
    if (!session || !session.user) { writeLS(SESSION_KEY, null); renderApp(); return; }
    authUid = session.user.id;
    if (!readLS(SESSION_KEY)) writeLS(SESSION_KEY, '1');   // show the splash, not the login form, while the board loads
    renderApp();
    fullLoad();
    startLive();
    setTimeout(() => { if (authUid && !sharedReady) { sharedStale = true; renderApp(); } }, 10000);
  }
  boot();
})();
