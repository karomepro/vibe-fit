<style>
  /* Layout: sticky white header · right-hand rail of training pages (RTL) · one main column.
     Scoreboard numerals in condensed Archivo against Cairo (display) / Tajawal (text).
     Palette: white + slate greys only — charcoal buttons with white text, and the reverse. */
  :root {
    --paper: #F8FAFC;
    --card: #FFFFFF;

    color-scheme: light;
  }
  html { background: var(--paper); }

    height: env(safe-area-inset-top, 0px);

    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  h1, h2, h3 { text-wrap: balance; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  input, select, button { font: inherit; }

  .inp {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;

  .toast {

  @keyframes toast-in { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

  @keyframes fade-in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  /* ---- set-by-set logging ---- */
  .ex-thumb { position: relative; width: 60px; height: 60px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); display: grid; place-items: center; flex-shrink: 0; transition: border-color .15s, transform .15s, box-shadow .15s; }
  .ex-thumb.is-anim { width: 84px; height: 76px; padding: 2px; overflow: hidden; background: linear-gradient(180deg, #F1F5F9, #FFFFFF); }
  .ex-thumb:hover { border-color: var(--mute); transform: translateY(-1px); box-shadow: 0 8px 18px -12px rgba(15, 23, 42, .35); }
  .ex-play { position: absolute; bottom: 4px; left: 4px; width: 18px; height: 18px; border-radius: 999px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; box-shadow: 0 2px 6px rgba(15, 23, 42, .25); }
  .ex-bob { animation: ic-lift 2.4s ease-in-out infinite; }
  .live-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--ink); animation: ai-pulse 1.4s ease-in-out infinite; }
  .btn-text { display: inline-flex; align-items: center; gap: .35rem; height: 2.25rem; padding: 0 .6rem; border-radius: 10px; font-weight: 700; font-size: .875rem; color: var(--ink); }
  .btn-text:hover { background: var(--paper); }
  .set-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) minmax(0, 1fr) 46px; gap: 6px; align-items: center; padding: 5px; border-radius: 18px; border: 1.5px solid transparent; transition: background .2s, border-color .2s; }
  .set-row.is-next { border-color: var(--ink); }

  .set-no { font-size: 14px; font-weight: 800; color: var(--mute); text-align: center; }
  .is-done .set-no { color: var(--ink); }
  .stepper { position: relative; display: flex; align-items: center; height: 52px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); min-width: 0; }
  .is-done .stepper { background: var(--card); }
  .stepper button { width: 32px; height: 100%; flex-shrink: 0; display: grid; place-items: center; font-size: 22px; font-weight: 600; color: var(--ink-2); border-radius: 13px; transition: background .12s, transform .08s; }
  .stepper button:hover { background: rgba(148, 163, 184, .18); color: var(--ink); }

  .stepper .val { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .stepper input, .stepper .sv { width: 100%; text-align: center; background: transparent; border: 0; padding: 0; color: var(--ink); font-family: var(--f-num); font-weight: 800; font-size: 22px; font-stretch: 86%; font-variant-numeric: tabular-nums; }
  .stepper input:focus { outline: none; }
  .stepper:focus-within { border-color: var(--ink-2); box-shadow: 0 0 0 3px rgba(148, 163, 184, .25); }
  .stepper .unit { margin-top: 3px; font-size: 10.5px; font-weight: 700; color: var(--mute); }
  .stepper.is-static { justify-content: center; }
  .set-check { width: 44px; height: 44px; justify-self: center; border-radius: 999px; border: 2px solid var(--line-2); display: grid; place-items: center; color: transparent; transition: background .2s, border-color .2s, color .2s; }
  .set-check:hover { border-color: var(--ink-2); color: var(--line-2); }
  .is-done .set-check { background: var(--ink); border-color: var(--ink); color: var(--on-ink); animation: check-pop .35s cubic-bezier(.2, 1.6, .4, 1); }
  .hype-pop { position: absolute; left: 0; right: 0; top: -4px; text-align: center; font-size: 11.5px; font-weight: 800; color: var(--ink); white-space: nowrap; pointer-events: none; animation: pop-up 1.2s ease-out forwards; }
  @media (max-width: 400px) {
    .stepper button { width: 27px; font-size: 20px; }

    .set-row { grid-template-columns: 16px minmax(0, 1fr) minmax(0, 1fr) 42px; gap: 5px; padding: 4px; }

  /* ---- session bar ---- */
  .sbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: rgba(255, 255, 255, .97); backdrop-filter: blur(10px); border-top: 1px solid var(--line); box-shadow: 0 -12px 30px -18px rgba(15, 23, 42, .35); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); animation: bar-in .3s cubic-bezier(.2, .8, .2, 1) both; }
  .sbar-in { max-width: 56rem; margin: 0 auto; display: flex; align-items: center; gap: 12px; }

    background: radial-gradient(120% 90% at 50% 42%, rgba(51, 65, 85, .95) 0%, rgba(15, 23, 42, .97) 55%, rgba(2, 6, 23, .985) 100%);
    padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    animation: hype-in .2s ease-out both; }
  .hype::before { content: ""; position: absolute; inset: 0; background: #FFFFFF; opacity: 0; pointer-events: none; animation: hype-flash .5s ease-out .05s both; }
  .hype canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hype-rings i { position: absolute; left: 50%; top: 44%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .6); opacity: 0; animation: hype-ring 1.15s cubic-bezier(.1, .6, .3, 1) both; }
  .hype-rings i:nth-child(2) { animation-delay: .12s; }
  .hype-rings i:nth-child(3) { animation-delay: .24s; }
  .hype-core { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; color: #FFFFFF; max-width: 100%; }
  .hype-emoji { font-size: clamp(64px, 17vw, 136px); line-height: 1; filter: drop-shadow(0 12px 30px rgba(0, 0, 0, .5)); animation: hype-emoji .7s cubic-bezier(.2, 1.5, .4, 1) .08s both, hype-bob 1.6s ease-in-out .8s infinite; }
  .hype-word { position: relative; font-family: var(--f-num); font-weight: 900; font-stretch: 125%; font-size: clamp(70px, 21vw, 250px); line-height: .86; color: #FFFFFF; text-shadow: 0 0 34px rgba(255, 255, 255, .35), 0 8px 0 rgba(15, 23, 42, .55); animation: hype-slam .62s cubic-bezier(.16, 1.3, .3, 1) .1s both; }
  .hype-word.ar { font-family: var(--f-display); font-stretch: 100%; font-size: clamp(58px, 17vw, 168px); line-height: 1.15; }
  .hype-word::before, .hype-word::after { content: attr(data-text); position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .hype-word::before { color: #94A3B8; animation: hype-glitch-a .45s steps(2) .2s 3; }
  .hype-word::after { color: #E2E8F0; animation: hype-glitch-b .45s steps(2) .2s 3; }
  .hype-sub { font-family: var(--f-display); font-weight: 800; font-size: clamp(22px, 5.6vw, 36px); line-height: 1.3; animation: hype-rise .5s ease-out .45s both; }
  .hype-detail { display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .5rem; max-width: 100%; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .2); border-radius: 999px; padding: .5rem 1rem; font-size: 15px; font-weight: 700; animation: hype-rise .5s ease-out .6s both; }
  .hype-plus { background: #FFFFFF; color: #0F172A; border-radius: 999px; padding: .1rem .6rem; font-weight: 900; }
  .hype-tag { font-family: var(--f-num); font-size: 13px; font-weight: 800; letter-spacing: .14em; color: #CBD5E1; animation: hype-rise .5s ease-out .75s both; }
  .hype-tap { position: absolute; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: #94A3B8; animation: hype-rise .4s ease-out 1.1s both; }
  .hype.out { animation: hype-out .26s ease-in forwards; }
  .shake { animation: shake .55s cubic-bezier(.36, .07, .19, .97) both; }
  @keyframes hype-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes hype-out { to { opacity: 0; transform: scale(1.04); } }
  @keyframes hype-flash { 0% { opacity: .85; } 100% { opacity: 0; } }

  @keyframes hype-emoji { 0% { opacity: 0; transform: translateY(40px) scale(.3) rotate(-25deg); } 100% { opacity: 1; transform: none; } }
  @keyframes hype-bob { 50% { transform: translateY(-8px) rotate(5deg); } }
  @keyframes hype-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes hype-glitch-a { 0% { opacity: .85; transform: translate(-7px, 2px); } 50% { transform: translate(5px, -3px); } 100% { opacity: 0; transform: none; } }
  @keyframes hype-glitch-b { 0% { opacity: .85; transform: translate(7px, -2px); } 50% { transform: translate(-4px, 3px); } 100% { opacity: 0; transform: none; } }
  @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-9px, 2px, 0); } 40%, 60% { transform: translate3d(9px, -2px, 0); } }

  .ai-scan { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15, 23, 42, .28), rgba(15, 23, 42, .05) 35%, rgba(255, 255, 255, .7) 50%, rgba(15, 23, 42, .05) 65%, rgba(15, 23, 42, .28)); background-size: 100% 260%; animation: ai-scan 1.5s ease-in-out infinite alternate; }

  let logoSeq = 0;

  /* =========================================================
     Storage (localStorage as the database, with in-memory fallback)
     ========================================================= */
  const DB_KEY = 'vibefit.db.v1';
  const SESSION_KEY = 'vibefit.session.v1';
  let storageOK = true;
  function readLS(k) { try { return window.localStorage.getItem(k); } catch (e) { storageOK = false; return null; } }
  function writeLS(k, v) {
    try { if (v === null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v); return true; }
    catch (e) { storageOK = false; return false; }
  }
  function loadDB() {
    const raw = readLS(DB_KEY);
    if (raw) { try { const d = JSON.parse(raw); if (d && d.users) return d; } catch (e) { /* corrupted: start fresh */ } }
    return { version: 1, users: {}, createdAt: Date.now() };
  }
  function saveDB(u) {
    if (isShared()) { const t = u || me(); if (t && !readOnly) syncUser(t); return; }
    if (mode === 'local') writeLS(DB_KEY, JSON.stringify(db));
  }

  /* =========================================================
     Users & pages
     ========================================================= */
  const userKey = name => String(name).trim().replace(/\s+/g, ' ').toLowerCase();
  const accIdOf = key => 'a' + cyrb53('acc|' + key, 5);
  const mkEx = name => ({ id: 'e' + uid(), name });
  function defaultProfile() { return { sex: 'm', age: 28, height: 175, weight: 75, activity: 1.55, goal: 'maintain', set: false }; }
  function defaultPages() {
    return [
      { id: 'resist', kind: 'resistance', builtin: true, name: 'تمارين المقاومة', desc: 'سجّل تمارين الحديد والأجهزة: الجولات والعدات والوزن، والحاسبة تجمع يومك تلقائياً.',
        exercises: ['بنش برس', 'سكوات', 'سحب أمامي (لات بول داون)', 'ضغط أكتاف بالدمبل'].map(mkEx) },
      { id: 'deadlift', kind: 'deadlift', builtin: true, name: 'الديدلفت', desc: 'صفحة مخصصة لأرقامك في الديدلفت: أعلى وزن، الرقم القياسي، وتطوّر الأوزان من جلسة لأخرى.',
        exercises: ['ديدلفت كلاسيكي', 'ديدلفت روماني', 'سومو ديدلفت'].map(mkEx) }
    ];
  }
  function makeUser(name, pass, extra = {}) {
    const key = userKey(name);
    return Object.assign({
      username: String(name).trim(), key, accId: accIdOf(key), pass: hashPass(key, pass), createdAt: Date.now(),
      profile: defaultProfile(), pages: defaultPages(), logs: [], cardio: [], meals: []
    }, extra);
  }
  const hasActivity = (u, d) => u.logs.some(l => l.date === d) || u.cardio.some(c => c.date === d) || u.meals.some(m => m.date === d);

  /* =========================================================
     Calculations
     ========================================================= */
  // ACSM metabolic equations — VO2 in ml/kg/min.
  // Walking: VO2 = 0.1·S + 1.8·S·G + 3.5   Running: VO2 = 0.2·S + 0.9·S·G + 3.5   (S in m/min, G = grade)
  function acsm(speedKmh, inclinePct, minutes, weightKg) {
    const mpm = speedKmh * 1000 / 60;
    const grade = Math.max(0, inclinePct || 0) / 100;
    const running = speedKmh >= RUN_THRESHOLD;
    const kH = running ? 0.2 : 0.1, kV = running ? 0.9 : 1.8;
    const horiz = kH * mpm, vert = kV * mpm * grade, rest = 3.5;
    const vo2 = horiz + vert + rest;
    const kcalMin = vo2 * weightKg / 1000 * 5;        // ≈ 5 kcal per litre of O2
    const distance = speedKmh * minutes / 60;
    return {
      mpm, grade, running, kH, kV, horiz, vert, rest, vo2, met: vo2 / 3.5, kcalMin,
      kcal: kcalMin * minutes, distance, climb: distance * 1000 * grade, pace: speedKmh > 0 ? 60 / speedKmh : 0
    };
  }
  const paceStr = p => { if (!(p > 0) || !Number.isFinite(p)) return '—'; let m = Math.floor(p), s = Math.round((p - m) * 60); if (s === 60) { m += 1; s = 0; } return `${m}:${pad2(s)}`; };
  const bmr = p => { const b = 10 * p.weight + 6.25 * p.height - 5 * p.age; return p.sex === 'f' ? b - 161 : b + 5; };
  const tdee = p => bmr(p) * p.activity;
  const dailyTarget = p => tdee(p) + ((GOALS[p.goal] || GOALS.maintain).adj);
  const validProfile = p => p && p.age >= 10 && p.age <= 100 && p.height >= 100 && p.height <= 250 && p.weight >= 25 && p.weight <= 300 && p.activity > 0;
  const epley = (w, r) => r <= 1 ? w : w * (1 + r / 30);
  const strideM = heightCm => (heightCm || 170) * 0.415 / 100;

  function dayStats(u, date) {
    const kinds = {}; u.pages.forEach(p => { kinds[p.id] = p.kind; });
    const logs = u.logs.filter(l => l.date === date);
    let reps = 0, sets = 0, volume = 0, dlTop = 0, resTop = 0;
    logs.forEach(l => {
      const r = l.sets * l.reps, w = l.weight || 0;
      reps += r; sets += l.sets; volume += r * w;
      if (kinds[l.pageId] === 'deadlift') dlTop = Math.max(dlTop, w); else resTop = Math.max(resTop, w);
    });
    const prevDl = u.logs.reduce((m, l) => (l.date < date && kinds[l.pageId] === 'deadlift') ? Math.max(m, l.weight || 0) : m, 0);
    const pr = dlTop > 0 && prevDl > 0 && dlTop > prevDl;
    const cardio = u.cardio.filter(c => c.date === date);
    const walkMin = sum(cardio, c => c.minutes);
    const cardioKcal = sum(cardio, c => c.kcal);
    const distance = sum(cardio, c => c.distance);
    const tm = cardio.filter(c => c.mode === 'treadmill');
    const tmMin = sum(tm, c => c.minutes);
    const tmSpeed = tmMin ? sum(tm, c => c.speed * c.minutes) / tmMin : 0;
    const tmIncline = maxOf(tm, c => c.incline);
    const wt = (u.profile && u.profile.weight) || 75;
    const liftKcal = LIFT_MET * 3.5 * wt / 200 * sets * MIN_PER_SET;
    const eaten = sum(u.meals.filter(m => m.date === date), m => m.kcal);
    const pts = {
      reps: reps * SCORE.perRep,
      volume: volume / SCORE.volumePer,
      cardio: walkMin * SCORE.perCardioMin,
      burn: cardioKcal / SCORE.kcalPer,
      pr: pr ? SCORE.prBonus : 0
    };
    const score = Math.round(pts.reps + pts.volume + pts.cardio + pts.burn + pts.pr);
    return { reps, sets, volume, dlTop, resTop, pr, prevDl, walkMin, cardioKcal, distance, tmMin, tmSpeed, tmIncline, liftKcal, burnTotal: cardioKcal + liftKcal, eaten, pts, score, exercises: new Set(logs.map(l => l.exId)).size };
  }
  function ranking(date) {
    return Object.values(db.users)
      .map(u => Object.assign({ key: u.key, name: u.username, streak: streakOf(u) }, dayStats(u, date)))
      .sort((a, b) => b.score - a.score || b.reps - a.reps || a.name.localeCompare(b.name, 'ar'));
  }
  function pageDayStats(u, pageId, date) {
    const logs = u.logs.filter(l => l.pageId === pageId && l.date === date);
    return {
      reps: sum(logs, l => l.sets * l.reps),
      sets: sum(logs, l => l.sets),
      volume: sum(logs, l => l.sets * l.reps * (l.weight || 0)),
      top: maxOf(logs, l => l.weight),
      exercises: new Set(logs.map(l => l.exId)).size
    };
  }

  function pageIcon(p) { return p.kind === 'program' ? 'calendar' : p.kind === 'deadlift' ? 'barbell' : p.kind === 'resistance' ? 'dumbbell' : 'layers'; }
  function navGroups(u) {
    const d = today();
    const st = dayStats(u, d);

    const info = planInfo(u);
    return [
      { title: 'التنافس', items: [

          ${[['العدات', fmt(r.reps), ''], ['ديدلفت', r.dlTop ? fmt(r.dlTop, 1) : '—', r.dlTop ? 'كجم' : ''], ['مشي', fmt(r.walkMin), 'د']].map(([l, v, un]) => `

    return `<section class="space-y-6 fade-in">
      ${pageHeader(kindLabel, esc(page.name), page.desc ? esc(page.desc) : '', sideBtns)}
      ${page.prog ? programBanner(u, page) : ''}
      ${statTiles([
        { label: 'إجمالي العدات اليوم', value: fmt(ps.reps), unit: 'عدة', note: `في ${fmt(ps.exercises)} تمارين` },
        { label: 'الحجم التدريبي اليوم', value: fmt(ps.volume), unit: 'كجم', note: 'الجولات × العدات × الوزن', dark: true },

      ])}

        : `<div class="card p-8 text-center"><p class="font-display font-bold text-slate-800">لا توجد تمارين في هذه الصفحة بعد</p><p class="text-sm text-slate-500 mt-1">أضف أول تمرين بالاسم من الحقل أدناه أو اختر من الاقتراحات.</p></div>`}
      <div class="card p-4 sm:p-5">

          <input id="new-ex" class="inp h-11 w-full sm:flex-1" maxlength="40" autocomplete="off" placeholder="أضف تمريناً جديداً بالاسم، مثل: تجديف بالبار">
          <button class="btn-dark h-11">${icon('plus', 'w-4 h-4')} إضافة تمرين</button>
        </form>
        ${sugg.length ? `<div class="mt-3 flex flex-wrap items-center gap-2"><span class="text-xs text-slate-400 font-bold">اقتراحات سريعة:</span>${sugg.map(s => `<button data-act="ex-suggest" data-page="${page.id}" data-name="${esc(s)}" class="chip h-8">+ ${esc(s)}</button>`).join('')}</div>` : ''}

  // Deadlift-specific: PR, estimated 1RM, progression chart, plate calculator
  function deadliftPanel(u, page) {
    const logs = u.logs.filter(l => l.pageId === page.id && l.weight > 0);
    const byDate = {};
    logs.forEach(l => { byDate[l.date] = Math.max(byDate[l.date] || 0, l.weight); });
    const series = Object.keys(byDate).sort().slice(-10).map(d => ({ d, v: byDate[d] }));
    const prLog = logs.slice().sort((a, b) => b.weight - a.weight || a.ts - b.ts)[0];
    const best1rm = logs.filter(l => l.reps <= 10).reduce((m, l) => Math.max(m, epley(l.weight, l.reps)), 0);
    const exName = prLog ? (page.exercises.find(e => e.id === prLog.exId) || {}).name || '' : '';
    if (ui.plateW == null) ui.plateW = prLog ? String(prLog.weight) : '100';
    return `<div class="grid gap-4 xl:grid-cols-[minmax(0,1fr)_320px] items-start">
      <div class="card p-4 sm:p-5">
        <div class="flex flex-wrap items-baseline justify-between gap-2">
          <h2 class="font-display font-extrabold text-lg text-slate-900">تطوّر أعلى وزن في كل جلسة</h2>
          <span class="text-xs text-slate-400">آخر ${fmt(series.length)} جلسات · كجم</span>
        </div>
        <div class="mt-3 overflow-x-auto">${lineChart(series)}</div>
      </div>
      <div class="grid gap-4">
        <div class="grid grid-cols-2 gap-3">
          <div class="rounded-2xl bg-slate-800 text-white p-4">
            <p class="text-xs font-bold text-slate-300">رقمك القياسي</p>
            <p class="mt-1"><span class="num text-3xl font-extrabold">${prLog ? fmt(prLog.weight, 2) : '—'}</span> <span class="text-xs text-slate-300">${prLog ? 'كجم' : ''}</span></p>
            <p class="text-[11px] text-slate-400 mt-0.5 leading-4">${prLog ? `${esc(exName)} · ${shortDate(prLog.date)}` : 'سجّل أول جلسة'}</p>
          </div>
          <div class="rounded-2xl bg-white border border-slate-200 p-4">
            <p class="text-xs font-bold text-slate-500"><span dir="ltr">1RM</span> التقديري</p>
            <p class="mt-1"><span class="num text-3xl font-extrabold text-slate-900">${best1rm ? fmt(best1rm, 1) : '—'}</span> <span class="text-xs text-slate-400">${best1rm ? 'كجم' : ''}</span></p>
            <p class="text-[11px] text-slate-400 mt-0.5 leading-4">بمعادلة <span dir="ltr">Epley</span> من أفضل جلساتك</p>
          </div>
        </div>
        <div class="card p-4">
          <div class="flex items-center justify-between gap-3">
            <label for="plate-w" class="font-display font-bold text-slate-900">حاسبة الأقراص</label>
            <span class="text-[11px] text-slate-400">بار أولمبي <span class="num">${BAR_KG}</span> كجم</span>
          </div>
          <div class="mt-2 flex flex-wrap items-center gap-2">
            <input id="plate-w" class="inp num h-10 text-center" style="width:7rem" inputmode="decimal" value="${esc(ui.plateW)}" aria-label="الوزن المستهدف بالكيلوجرام">
            <span class="text-sm text-slate-500">كجم على البار</span>
          </div>
          <div id="plate-out" class="mt-3">${platesHTML(num(ui.plateW))}</div>
        </div>
      </div>
    </div>`;
  }
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }
  function lineChart(series) {
    if (series.length < 2) {
      return `<div class="h-48 grid place-items-center text-center px-6 rounded-xl bg-slate-50 border border-dashed border-slate-200">
        <div>${icon('chart', 'w-7 h-7 mx-auto text-slate-300')}<p class="mt-2 text-sm text-slate-500">سجّل الديدلفت في يومين مختلفين على الأقل لترى منحنى تطوّر الأوزان.</p></div>
      </div>`;
    }
    const W = 600, H = 230, pl = 46, pr = 18, pt = 26, pb = 30;
    const vals = series.map(s => s.v);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const span = Math.max(hi - lo, 10);
    const step = niceStep((span * 1.4) / 4);
    lo = Math.max(0, Math.floor((lo - span * 0.25) / step) * step);
    hi = Math.ceil((hi + span * 0.12) / step) * step;
    if (hi === lo) hi = lo + step;
    const x = i => pl + i * (W - pl - pr) / (series.length - 1);
    const y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
    const ticks = [];
    for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(v);
    const line = series.map((s, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(s.v).toFixed(1)}`).join(' ');
    const area = `${line} L${x(series.length - 1).toFixed(1)} ${H - pb} L${x(0).toFixed(1)} ${H - pb} Z`;
    const maxV = Math.max(...vals);
    const prI = vals.lastIndexOf(maxV);
    const every = series.length > 8 ? 2 : 1;
    const anchor = prI === 0 ? 'start' : prI === series.length - 1 ? 'end' : 'middle';
    return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto min-w-[420px]" dir="ltr" style="direction:ltr" role="img" aria-label="منحنى أعلى وزن ديدلفت في آخر ${series.length} جلسات، أعلاه ${fmt(maxV, 1)} كجم">
      ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#E2E8F0" stroke-width="1"/>
        <text x="${pl - 10}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#94A3B8" font-family="Archivo, Cairo, sans-serif">${fmt(v, 1)}</text>`).join('')}
      <path d="${area}" fill="#F1F5F9"/>
      <path d="${line}" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${series.map((s, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(s.v).toFixed(1)}" r="${i === prI ? 6 : 3.8}" fill="${i === prI ? '#1E293B' : '#FFFFFF'}" stroke="#1E293B" stroke-width="2"><title>${shortDate(s.d)}: ${fmt(s.v, 1)} كجم</title></circle>`).join('')}
      ${series.map((s, i) => (i % every === 0 || i === series.length - 1) ? `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#94A3B8" font-family="Archivo, Cairo, sans-serif">${shortDate(s.d)}</text>` : '').join('')}
      <text x="${x(prI).toFixed(1)}" y="${Math.max(13, y(maxV) - 13).toFixed(1)}" text-anchor="${anchor}" font-size="12" font-weight="700" fill="#1E293B" font-family="Cairo, Archivo, sans-serif">${fmt(maxV, 1)} كجم · الأعلى</text>
    </svg>`;
  }
  function platesHTML(w) {
    if (!(w >= BAR_KG)) return `<p class="text-sm text-slate-500">أدخل وزناً من ${BAR_KG} كجم فأكثر (وزن البار وحده ${BAR_KG} كجم).</p>`;
    if (w > 600) return `<p class="text-sm text-slate-500">أدخل وزناً أقل من 600 كجم.</p>`;
    let side = (w - BAR_KG) / 2;
    const out = [];
    PLATES.forEach(p => { while (side >= p - 1e-9) { out.push(p); side -= p; } });
    const rem = side * 2;
    const shade = p => p >= 25 ? '#1E293B' : p >= 20 ? '#334155' : p >= 15 ? '#475569' : p >= 10 ? '#64748B' : p >= 5 ? '#94A3B8' : p >= 2.5 ? '#CBD5E1' : '#E2E8F0';
    const hgt = p => p >= 15 ? 64 : p >= 10 ? 54 : p >= 5 ? 42 : p >= 2.5 ? 32 : 26;
    const wid = p => p >= 20 ? 15 : p >= 10 ? 12 : 9;
    return `<div class="flex items-center h-[70px] overflow-hidden" dir="ltr" aria-hidden="true">
        <span class="w-10 h-2.5 rounded-s-full bg-slate-300 shrink-0"></span>
        <span class="w-2 h-6 rounded-sm bg-slate-400 shrink-0"></span>
        ${out.map(p => `<span class="shrink-0 rounded-[3px] ms-[2px] grid place-items-center num text-[9px] font-bold" style="width:${wid(p)}px;height:${hgt(p)}px;background:${shade(p)};color:${p >= 10 ? '#FFFFFF' : '#1E293B'}">${p >= 10 ? `<span style="writing-mode:vertical-rl">${p}</span>` : ''}</span>`).join('')}
        <span class="w-3 h-5 rounded-sm bg-slate-500 ms-[2px] shrink-0"></span>
        <span class="flex-1 h-2.5 rounded-e-full bg-slate-300 min-w-[16px]"></span>
      </div>
      <p class="mt-1 text-sm text-slate-700">في كل جانب: ${out.length ? `<b class="num" dir="ltr">${out.map(p => fmt(p, 2)).join(' + ')}</b> كجم` : 'البار وحده، بلا أقراص'}</p>
      ${rem > 0.001 ? `<p class="text-xs text-slate-400 mt-0.5">يتبقى <span class="num">${fmt(rem, 2)}</span> كجم لا يمكن تحميلها بالأقراص المتاحة.</p>` : ''}`;
  }

  /* =========================================================

${desc ? `ملاحظة المستخدم: """${desc.replace(/"""/g, '"')}"""\n` : ''}القواعد:

  /* =========================================================
     Exercise illustrations — an animated mannequin per movement pattern.
     Poses are built with forward/inverse kinematics on a 120×108 canvas and
     animated with SVG SMIL, so they are original drawings with no image files.
     Side view: 0° = limb pointing down, +90° = forward (+x).
     Front view: same, with + meaning outward for both sides.
     ========================================================= */
  const FIGL = { torso: 30, ua: 16, fa: 15, th: 22, sh: 21, foot: 6.5, head: 12 };
  let FIG_STILL = false;          // reduced motion: draw the working position without movement

  // two-bone IK: the middle joint sits on the `bend` side (+1 / −1) of the root→target line
  function fik(O, T, l1, l2, bend) {
    const dx = T[0] - O[0], dy = T[1] - O[1];
    const d = Math.min(Math.max(Math.hypot(dx, dy) || 0.01, Math.abs(l1 - l2) + 0.01), l1 + l2 - 0.01);
    const a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
    const base = Math.atan2(dy, dx) + (bend || 1) * a;
    const J = [O[0] + l1 * Math.cos(base), O[1] + l1 * Math.sin(base)];
    const ex = T[0] - J[0], ey = T[1] - J[1], el = Math.hypot(ex, ey) || 0.01;
    return [J, [J[0] + ex / el * l2, J[1] + ey / el * l2]];

    const s = spec.l || [1, 1];

    const m = mirror ? -1 : 1;

      J.cx = P[0];

      if (p.leg2) { const [K, F] = flimb(P, p.leg2, FIGL.th, FIGL.sh, false, J); J.K2 = K; J.F2 = F; J.T2 = fadd(F, p.ft2 != null ? p.ft2 : 90, FIGL.foot); }

  // ---- set actions ----
  function evaluateHype(u, ex, w, r) {
    const d = today();
    const ids = sameExIds(u, ex);
    const prevAll = u.logs.filter(l => ids.has(l.exId));
    if (!prevAll.some(l => l.date < d)) return null;               // nothing to beat yet
    const allMax = maxOf(prevAll, l => l.weight);
    if (w > 0 && allMax > 0 && w > allMax) return { tier: 3, key: 'goat', delta: w - allMax };
    const last = lastSession(u, ex);
    if (!last) return null;
    const lastTop = Math.max(...last.sets.map(s => s.w));
    if (w > 0 && w > lastTop) return { tier: 2, key: 'beast', delta: w - lastTop };
    if (w === lastTop) {
      const lastR = Math.max(0, ...last.sets.filter(s => s.w === w).map(s => s.r));
      if (lastR > 0 && r > lastR) return { tier: 1, key: 'nasr', delta: r - lastR };

    return null;

    if (!Number.isInteger(r) || r < 1 || r > 500) { toast('عدد العدات غير صحيح', 'أدخل رقماً صحيحاً من 1 إلى 500.', 'err'); return; }

      if (t && t.rpe && w > 0 && r <= 15) {
        entry.rpe = t.rpe; entry.lift = meta.lift;
        entry.e1 = Math.round(w / meta.ratio / rpePct(r, t.rpe) * 10) / 10;
        if (!liftMax(u, meta.lift)) { calib = { v: round25(entry.e1), rpe: t.rpe }; setLiftMax(u, meta.lift, calib.v); }
      }
    }
    u.logs.push(entry);
    rows.splice(i, 1);
    if (meta.plan && meta.lift) {
      const T2 = liftTargets(u, ex, meta);
      rows.forEach(x => { const t = x.ti != null ? T2[x.ti] : null; if (!x.touched && t) { x.w = t.w || x.w; x.r = t.r; } });
    } else rows.forEach(x => { if (!x.touched) { x.w = w; x.r = r; } });

  function logHeat(u, sel) {

    const moved = new Set(u.cardio.filter(c => c.date >= start).map(c => c.date));
    const mx = Math.max(1, ...Object.values(by));
    const cells = [];
    for (let i = 0; i < 84; i++) {
      const dd = shiftDate(start, i);
      if (dd > t) { cells.push('<span class="hm-c is-off" aria-hidden="true"></span>'); continue; }
      const n = by[dd] || 0, lv = n ? Math.max(1, Math.min(4, Math.ceil(n / mx * 4))) : 0;
      const what = n ? `${fmt(n)} ${setsWord(n)}` : moved.has(dd) ? 'كارديو' : 'راحة';
      cells.push(`<button type="button" data-act="log-day" data-d="${dd}" class="hm-c lv${lv}${!n && moved.has(dd) ? ' is-cardio' : ''}${dd === sel ? ' is-sel' : ''}" title="${esc(longDate(dd))}: ${what}" aria-label="${esc(longDate(dd))}: ${what}"></button>`);
    }

  /* =========================================================

  function toast(msg, sub = '', type = 'ok') {
    const box = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast' + (type === 'err' ? ' err' : '');
    el.setAttribute('role', type === 'err' ? 'alert' : 'status');
    el.innerHTML = `<span class="ic">${icon(type === 'err' ? 'info' : 'check', 'w-4 h-4')}</span><div class="min-w-0"><p class="t1">${esc(msg)}</p>${sub ? `<p class="t2">${esc(sub)}</p>` : ''}</div>`;
    box.appendChild(el);
    while (box.children.length > 3) box.firstElementChild.remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 240); }, type === 'err' ? 3600 : 2800);
  }

    if (['board', 'cardio', 'calories', 'chat', 'programs', 'log', 'science', 'news'].includes(view)) return view;

    if (view === 'programs') return programsView(u);
    if (view === 'log') return logView(u);
    if (view === 'science') return scienceView(u);
    if (view === 'news') return newsView(u);

  function setAuthError(msg) {

  function startSession(u, isNew) {
    currentKey = u.key;

    else toast(`أهلاً بعودتك، ${u.username}`, 'بياناتك محمّلة وجاهزة.');

  function doLogin(name, pass) {
    if (mode === 'firebase') return fbLogin(name, pass);
    if (mode === 'loading' || (mode === 'shared' && !sharedReady)) return setAuthError('لحظة، جارٍ تحميل الحسابات…');
    const key = userKey(name);
    if (!key) return setAuthError('اكتب اسم المستخدم.');
    if (!pass) return setAuthError('اكتب كلمة المرور.');
    const u = db.users[key];
    if (!u) return setAuthError(`لا يوجد حساب باسم «${name.trim()}». تأكد من الاسم أو أنشئ حساباً جديداً.`);
    if (u.pass !== hashPass(key, pass)) return setAuthError('كلمة المرور غير صحيحة. حاول مرة أخرى.');
    startSession(u, false);
  }
  function doRegister(name, pass) {
    if (mode === 'firebase') return fbRegister(name, pass);
    if (mode === 'loading' || (mode === 'shared' && !sharedReady)) return setAuthError('لحظة، جارٍ تحميل الحسابات…');
    if (readOnly) return setAuthError('لديك صلاحية المشاهدة فقط، لذلك لا يمكنك إنشاء حساب. اطلب من صاحب الصفحة صلاحية «Contributor».');
    const n = name.trim().replace(/\s+/g, ' ').slice(0, 30);
    if (!n) return setAuthError('اكتب اسم المستخدم.');
    const key = userKey(n);
    if (db.users[key]) return setAuthError(`اسم المستخدم «${n}» مستخدم بالفعل. اختر اسماً آخر أو سجّل الدخول.`);
    if (!pass) return setAuthError('اكتب أي كلمة مرور.');
    const u = makeUser(n, pass);
    db.users[key] = u;
    saveDB(u);
    startSession(u, true);
  }
  function logout() {
    const name = me() ? me().username : '';

    if (mode === 'firebase') {
      if (ui.modal) closeModal();

      toast('تم تسجيل الخروج', name ? `إلى اللقاء يا ${name}. بياناتك محفوظة.` : '');
      return;

  }

  function addExercise(u, pageId, rawName) {
    const page = u.pages.find(p => p.id === pageId); if (!page) return;
    const name = String(rawName || '').trim().replace(/\s+/g, ' ');
    if (!name) { toast('اكتب اسم التمرين أولاً', '', 'err'); return; }
    if (name.length > 40) { toast('اسم التمرين طويل', 'استخدم 40 حرفاً أو أقل.', 'err'); return; }
    if (page.exercises.some(e => e.name.toLowerCase() === name.toLowerCase())) { toast(`«${name}» موجود في هذه الصفحة`, '', 'err'); return; }
    page.exercises.unshift(mkEx(name));
    saveDB();
    renderApp();
    toast(`تمت إضافة تمرين «${name}»`, `في صفحة ${page.name}. سجّل جولاتك الآن.`);
  }
  function saveCardio(u) {
    const c = computeCardio(u);
    if (c.error) { toast('لا يمكن حفظ الجلسة', c.error, 'err'); return; }
    const entry = { id: uid(), date: today(), mode: c.mode, minutes: c.minutes, speed: Math.round(c.speed * 100) / 100, incline: c.incline, distance: Math.round(c.distance * 1000) / 1000, kcal: Math.round(c.kcal), ts: Date.now() };
    if (c.mode === 'outdoor') entry.steps = c.steps;
    u.cardio.push(entry);
    saveDB();
    renderApp();
    toast(c.mode === 'treadmill' ? 'تم حفظ جلسة السير الكهربائي' : 'تم حفظ جلسة المشي', `${fmt(c.minutes)} دقيقة · ${fmt(c.distance, 2)} كم · ${fmt(c.kcal)} سعرة · +${fmt(c.minutes * SCORE.perCardioMin + c.kcal / SCORE.kcalPer)} نقطة`);
  }
  function addMeal(u, name, kcal, slot, extra) {
    const n = String(name || '').trim() || 'وجبة';
    const k = num(kcal);
    if (!(k > 0) || k > 5000) { toast('السعرات غير صحيحة', 'أدخل رقماً بين 1 و 5000.', 'err'); const el = $('#meal-kcal'); if (el) el.focus(); return; }
    u.meals.push(Object.assign({ id: uid(), date: today(), slot: SLOTS[slot] ? slot : defaultSlot(), name: n.slice(0, 50), kcal: Math.round(k), ts: Date.now() }, extra || {}));
    saveDB();
    ui.mealSlot = slot;
    renderApp();
    toast(`أُضيفت: ${n}`, `${fmt(k)} سعرة إلى ${SLOTS[slot] || 'وجبات اليوم'}`);
  }
  function saveProfile(u) {
    const p = Object.assign({}, u.profile, ui.prof || {});
    if (!validProfile(p)) { toast('راجع بياناتك', 'العمر 10–100، الطول 100–250 سم، الوزن 25–300 كجم.', 'err'); return; }
    u.profile = Object.assign(p, { set: true });
    ui.prof = null;
    saveDB();
    renderApp();
    toast('تم حفظ بياناتك', `هدفك اليومي ${fmt(dailyTarget(u.profile))} سعرة`);
  }
  function addPage(u) {
    const name = ($('#np-name').value || '').trim().replace(/\s+/g, ' ');
    const desc = ($('#np-desc').value || '').trim();
    const exNames = ($('#np-ex').value || '').split(/[,،]/).map(s => s.trim()).filter(Boolean).slice(0, 12);
    const err = $('#np-err');
    if (!name) { err.textContent = 'اكتب اسماً للصفحة.'; $('#np-name').focus(); return; }
    if (u.pages.some(p => p.name.toLowerCase() === name.toLowerCase())) { err.textContent = `لديك صفحة باسم «${name}» بالفعل.`; $('#np-name').focus(); return; }
    if (u.pages.length >= 20) { err.textContent = 'وصلت إلى الحد الأقصى: 20 صفحة.'; return; }
    const page = { id: 'p' + uid(), kind: 'custom', builtin: false, name: name.slice(0, 30), desc: desc.slice(0, 80), exercises: Array.from(new Set(exNames)).map(n => mkEx(n.slice(0, 40))) };
    u.pages.push(page);
    saveDB();
    closeModal();
    setView('page-' + page.id);
    toast(`تمت إضافة صفحة «${page.name}»`, page.exercises.length ? `مع ${page.exercises.length} تمارين جاهزة للتسجيل.` : 'أضف تمارينك وابدأ التسجيل.');
  }

  /* =========================================================
     Events
     ========================================================= */
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    const u = me();
    if (WRITE_ACTS.has(act) && !guardWrite()) return;
    switch (act) {
      case 'nav': if (u) { closeDrawer(true); setView(t.dataset.v); } break;
      case 'drawer-open': if (u) openDrawer(); break;
      case 'drawer-close': closeDrawer(); break;
      case 'auth-mode': {
        const nameEl = $('#au-name'); if (nameEl) ui.authName = nameEl.value;
        ui.authMode = t.dataset.mode; renderApp();
        const f = $('#au-name'); if (f) f.focus();
        break;
      }
      case 'toggle-pass': {
        ui.showPass = !ui.showPass;
        ['#au-pass', '#au-pass2'].forEach(s => { const el = $(s); if (el) el.type = ui.showPass ? 'text' : 'password'; });
        t.innerHTML = icon(ui.showPass ? 'eyeOff' : 'eye');
        t.setAttribute('aria-label', (ui.showPass ? 'إخفاء' : 'إظهار') + ' كلمة المرور');
        break;
      }
      case 'logout': logout(); break;
      case 'open-add-page': closeDrawer(true); openModal('add-page'); break;
      case 'close-modal': closeModal(); break;
      case 'modal-bg': if (e.target === t) closeModal(); break;
      case 'np-suggest': {
        const s = PAGE_SUGGEST[+t.dataset.i]; if (!s) break;
        $('#np-name').value = s.n; $('#np-ex').value = s.ex.join('، ');
        $('#np-err').textContent = '';
        break;
      }
      case 'ex-suggest': if (u) addExercise(u, t.dataset.page, t.dataset.name); break;
      case 'ask-confirm': ui.confirm = t.dataset.key; renderApp(); break;
      case 'cancel-confirm': ui.confirm = null; renderApp(); break;
      case 'del-ex': {
        if (!u) break;
        const page = u.pages.find(p => p.id === t.dataset.page);
        const ex = page && page.exercises.find(x => x.id === t.dataset.id);
        if (!ex) break;
        page.exercises = page.exercises.filter(x => x.id !== ex.id);
        u.logs = u.logs.filter(l => l.exId !== ex.id);
        ui.confirm = null; saveDB(); renderApp();
        toast(`حُذف تمرين «${ex.name}»`);
        break;
      }
      case 'del-page': {
        if (!u) break;
        const page = u.pages.find(p => p.id === t.dataset.id);
        if (!page || page.builtin || page.prog) break;
        u.pages = u.pages.filter(p => p.id !== page.id);
        u.logs = u.logs.filter(l => l.pageId !== page.id);
        saveDB();
        setView('board');
        toast(`حُذفت صفحة «${page.name}»`);
        break;
      }
      case 'del-log': {
        if (!u) break;
        const gone = u.logs.find(l => l.id === t.dataset.id);
        u.logs = u.logs.filter(l => l.id !== t.dataset.id);
        if (gone && gone.date === today() && ui.drafts) { delete ui.drafts[gone.exId]; saveSessionState(); }   // rebuild that exercise's rows
        saveDB(); renderApp(); toast('حُذف التسجيل');
        break;
      }
      case 'cardio-mode': ui.cardioMode = t.dataset.mode; renderApp(); break;
      case 'out-measure': ui.outMeasure = t.dataset.v; renderApp(); break;
      case 'out-pace': ui.out.pace = t.dataset.v; renderApp(); break;
      case 'del-cardio': {
        if (!u) break;
        u.cardio = u.cardio.filter(c => c.id !== t.dataset.id);
        saveDB(); renderApp(); toast('حُذفت جلسة المشي');
        break;
      }
      case 'meal-quick': {
        if (!u) break;
        const slotEl = $('#meal-slot');
        addMeal(u, t.dataset.name, t.dataset.kcal, slotEl ? slotEl.value : defaultSlot());
        break;
      }
      case 'del-meal': {
        if (!u) break;
        u.meals = u.meals.filter(m => m.id !== t.dataset.id);
        saveDB(); renderApp(); toast('حُذفت الوجبة');
        break;
      }
      case 'chat-quick': sendChat(t.dataset.text); break;
      case 'set-done': if (u) completeSet(u, t.dataset.page, t.dataset.ex, +t.dataset.row); break;
      case 'set-undo': if (u) undoSet(u, t.dataset.id); break;
      case 'w-inc': case 'w-dec': case 'r-inc': case 'r-dec':
        if (u) stepRow(u, t.dataset.ex, +t.dataset.row, act[0], act.endsWith('inc') ? 1 : -1);
        break;
      case 'row-add': {
        const hit = u && findEx(u, t.dataset.ex);
        if (!hit) break;
        const rows = pendingRows(u, hit.ex);
        if (rows.length >= 20) break;
        const done = doneToday(u, hit.ex);
        const src = rows[rows.length - 1] || (done.length ? { w: done[done.length - 1].weight || 0, r: done[done.length - 1].reps } : suggestion(u, hit.ex, exMeta(hit.ex)));
        rows.push({ w: src.w, r: src.r });
        saveSessionState(); renderApp();
        break;
      }
      case 'row-remove': {
        const hit = u && findEx(u, t.dataset.ex);
        if (!hit) break;
        pendingRows(u, hit.ex).pop();
        saveSessionState(); renderApp();
        break;
      }
      case 'ex-menu': ui.exMenu = ui.exMenu === t.dataset.ex ? null : t.dataset.ex; ui.confirm = null; renderApp(); break;
      case 'cfg-save': {
        const hit = u && findEx(u, t.dataset.ex);
        if (!hit) break;
        const ex = hit.ex;
        const g = k => num(($('#cfg-' + k + '-' + ex.id) || {}).value);
        const sets = g('sets'), mn = g('min'), mx = g('max'), restS = g('rest'), inc = g('inc');
        const note = String(($('#cfg-note-' + ex.id) || {}).value || '').trim().slice(0, 140);
        if (!Number.isInteger(mn) || !Number.isInteger(mx) || mn < 1 || mx > 100 || mn > mx) { toast('نطاق العدات غير صحيح', 'اكتب رقمين صحيحين من 1 إلى 100، والأول أصغر من الثاني أو يساويه.', 'err'); break; }
        ex.cfg = Object.assign({}, ex.cfg, { sets: clamp(sets || 3, 1, 10), repMin: mn, repMax: mx, rest: clamp(restS || 90, 15, 600), inc: inc > 0 ? inc : 2.5, note });
        const m2 = exMeta(ex);
        const rows = pendingRows(u, ex);
        const want = Math.max(0, m2.sets - sum(doneToday(u, ex), l => l.sets));
        while (rows.length < want) rows.push(Object.assign({}, rows[rows.length - 1] || { w: 0, r: mn }, { touched: false }));
        while (rows.length > want) rows.pop();
        ui.exMenu = null;
        saveDB(); saveSessionState(); renderApp();
        toast('تم حفظ إعدادات التمرين', `${m2.sets} × ${repsLabel(m2)} · راحة ${restStr(m2.rest)}`);
        break;
      }
      case 'rest-add': if (rest) { rest.until += (+t.dataset.s) * 1000; rest.total = Math.max(rest.total, Math.ceil((rest.until - Date.now()) / 1000)); tickBar(); } break;
      case 'rest-skip': rest = null; renderBar(); break;
      case 'finish-open': openModal('finish'); break;
      case 'finish-close': finishWorkout(false); break;
      case 'finish-log': finishWorkout(false); setView('log'); break;
      case 'share-finish': finishWorkout(true); break;
      case 'hype-close': closeHype(); break;
      case 'ai-analyze': aiAnalyze(); break;
      case 'ai-slot': ui.aiSlot = t.dataset.v; renderApp(); break;
      case 'ai-stop': if (ui.ai.ctl) ui.ai.ctl.abort(); break;
      case 'ai-photo-clear': { const keep = ui.ai.desc; aiReset(true); ui.ai.desc = keep; renderApp(); break; }
      case 'ai-reset': aiReset(false); renderApp(); break;
      case 'ai-item-del': {
        const r = ui.ai.result;
        if (!r || !r.items) break;
        r.items.splice(+t.dataset.i, 1);
        if (!r.items.length) aiReset(true);
        renderApp();
        break;
      }
      case 'ai-add': {
        const r = ui.ai.result;
        if (!u || !r || !r.items) break;
        const tt = aiTotals(r);

        view = '';
        setView(welcome ? 'board' : (initialView || 'board'));
        if (welcome === 'new') toast(`أهلاً بك في Vibe Fit، ${acc.username}`, 'تم إنشاء حسابك. سجّل أول تمرين لتدخل لوحة التنافس.');
        else if (welcome === 'login') toast(`أهلاً بعودتك، ${acc.username}`, 'بياناتك محمّلة وجاهزة.');
      } else {
        requestRender();
      }
      return;
    }
    if (fbRegistering) return;                                   // the account record is on its way
    const raw = remote.accounts.get(fbUser.uid);
    if (raw && raw.deleted) { fbSignOut('حُذف هذا الحساب من المنافسة', 'تواصل مع المشرف إذا كان هذا خطأ.'); return; }
    if (fbLoginName) {                                           // signed in, record missing: recreate it
      const u = makeUser(fbLoginName, '');
      delete u.pass;
      u.accId = fbUser.uid;
      queueWrite('accounts/' + u.accId, accountPayload(u));
      fbLoginName = '';
      fbResolveSession();
      return;
    }
    fbSignOut();
  }
  function fbAuthError(code) {
    const bad = 'اسم المستخدم أو كلمة المرور غير صحيحة.';
    const map = {
      'auth/invalid-credential': bad, 'auth/invalid-login-credentials': bad, 'auth/wrong-password': bad, 'auth/user-not-found': bad,
      'auth/email-already-in-use': 'اسم المستخدم مستخدم بالفعل. اختر اسماً آخر أو سجّل الدخول.',
      'auth/too-many-requests': 'محاولات كثيرة متتالية. انتظر دقيقة ثم حاول مجدداً.',
      'auth/network-request-failed': 'تعذّر الاتصال بالإنترنت. تحقق من اتصالك ثم حاول مجدداً.',
      'auth/operation-not-allowed': 'تسجيل الدخول بالبريد وكلمة المرور غير مفعّل. فعّله من Firebase ← Authentication ← Sign-in method.',
      'auth/configuration-not-found': 'تسجيل الدخول غير مفعّل في مشروع Firebase بعد. افتح Firebase ← Authentication ← Get started ← Email/Password ← Enable.',
      'auth/admin-restricted-operation': 'إنشاء الحسابات مقفل في مشروع Firebase. فعّل Email/Password واسمح بإنشاء الحسابات من إعدادات Authentication.',
      'auth/unauthorized-domain': 'هذا الموقع غير مضاف في Firebase. أضفه من Authentication ← Settings ← Authorized domains.',
      'auth/invalid-api-key': 'مفتاح apiKey في إعدادات Firebase غير صحيح.',
      'auth/api-key-not-valid.-please-pass-a-valid-api-key.': 'مفتاح apiKey في إعدادات Firebase غير صحيح.'
    };
    return map[code] || `تعذّر إكمال العملية (${code || 'خطأ غير معروف'}). حاول مرة أخرى.`;
  }
  function setAuthBusy(busy) {
    const btn = $('form[data-form="auth"] button.btn-dark');
    if (!btn) return;
    btn.disabled = busy;
    btn.textContent = busy ? 'لحظة…' : (ui.authMode === 'register' ? 'إنشاء الحساب والدخول' : 'دخول');
  }
  function fbLogin(name, pass) {
    const n = String(name || '').trim().replace(/\s+/g, ' ');
    if (!n) return setAuthError('اكتب اسم المستخدم.');
    if (!pass) return setAuthError('اكتب كلمة المرور.');
    setAuthError(''); setAuthBusy(true);
    fbLoginName = n; fbWelcome = 'login';
    fauth.signInWithEmailAndPassword(emailOf(userKey(n)), padPass(pass)).catch(e => {
      fbLoginName = ''; fbWelcome = '';
      setAuthBusy(false);
      setAuthError(fbAuthError(e && e.code));
    });
  }
  function fbRegister(name, pass) {
    const n = String(name || '').trim().replace(/\s+/g, ' ').slice(0, 30);
    if (!n) return setAuthError('اكتب اسم المستخدم.');
    if (!pass) return setAuthError('اكتب أي كلمة مرور.');
    setAuthError(''); setAuthBusy(true);
    fbRegistering = true; fbWelcome = 'new';
    fauth.createUserWithEmailAndPassword(emailOf(userKey(n)), padPass(pass)).then(cred => {
      const u = makeUser(n, '');
      delete u.pass;
      u.accId = cred.user.uid;
      queueWrite('accounts/' + u.accId, accountPayload(u));
      fbRegistering = false;
      fbResolveSession();
    }).catch(e => {
      fbRegistering = false; fbWelcome = '';
      setAuthBusy(false);
      setAuthError(fbAuthError(e && e.code));
    });
  }
  function setupView(title, body) {
    return `<div class="min-h-screen grid place-items-center gutter py-10">
      <div class="max-w-md w-full text-center">
        ${logo('w-20 h-20 mx-auto')}
        <h1 class="mt-6 font-display font-extrabold text-2xl text-slate-900">${title}</h1>
        <p class="mt-2 text-slate-500 leading-7">${body}</p>
      </div>
    </div>`;
  }
  function bootFirebase(cfg) {
    mode = 'firebase';
    canWrite = true;
    initialView = view;
    try {
      firebase.initializeApp(cfg);
      // Realtime Database when the config names one, otherwise Cloud Firestore
      dbh = cfg.databaseURL ? rtdbAdapter(firebase.database()) : fsAdapter(firebase.firestore());
      fauth = firebase.auth();
    } catch (e) {
      $('#app').innerHTML = setupView('تعذّر تشغيل Firebase', 'راجع قيم firebaseConfig في أعلى ملف index.html.');
      return;
    }
    initAI();
    renderApp();
    fauth.onAuthStateChanged(user => {
      fbAuthKnown = true;
      if (user) {
        if (fbUser && fbUser.uid === user.uid) return;
        fbUser = user;
        resetSharedState();
        startLive();
        renderApp();
        setTimeout(() => { if (fbUser === user && !sharedReady) { sharedStale = true; renderApp(); } }, 10000);
      } else {
        fbUser = null;
        resetSharedState();
        fbLoginName = ''; fbWelcome = '';
        ui.authMode = 'login';
        renderApp();
      }
    });
  }

  /* =========================================================
     Boot
     ========================================================= */
  function bootLocal() {
    mode = 'local';
    db = loadDB();
    const demoKeys = Object.keys(db.users || {}).filter(k => db.users[k] && db.users[k].seed);
    if (demoKeys.length) { demoKeys.forEach(k => { delete db.users[k]; }); saveDB(); }
    chatMsgs = sanitizeChat(db.chat || []);
    restoreSession();
    renderApp();
    initAI();
    window.addEventListener('storage', e => {
      if (e.key === DB_KEY && e.newValue) {
        try { db = JSON.parse(e.newValue); chatMsgs = sanitizeChat(db.chat || []); if (!db.users[currentKey]) currentKey = null; renderApp(); } catch (err) { /* ignore */ }
      }
    });
  }

  /* =========================================================
     Intro: Domain Expansion — the hand sign snaps in, a void opens around it
     with streaking stars, the name appears, then the app is revealed.
     Plays every time the page opens; tap to skip.
     ========================================================= */
  function playIntro() {
    let reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* ignore */ }
    const el = document.createElement('div');
    el.id = 'intro';
    el.setAttribute('aria-hidden', 'true');
    const word = Array.from('VIBE FIT').map((c, i) => c === ' ' ? '<span class="dx-sp"> </span>' : `<span style="--i:${i}">${c}</span>`).join('');
    el.innerHTML = `<div class="dx-stage">
        <div class="dx-rays"></div><div class="dx-void"></div><div class="dx-rings"><i></i><i></i><i></i></div><canvas></canvas><div class="dx-charge"></div><div class="dx-flash"></div>
        <p class="dx-cap" dir="ltr">DOMAIN EXPANSION</p>
        ${logo('dx-logo')}
        <div class="dx-text"><p class="dx-word" dir="ltr">${word}</p><p class="dx-sub">فايب فيت</p><p class="dx-tag">سجّل · نافس · تطوّر</p></div>
      </div>
      <p class="dx-skip">اضغط للتخطي</p>`;
    document.body.appendChild(el);
    document.documentElement.classList.add('intro-on');
    let raf = 0, done = false;
    const finish = () => {
      if (done) return;
      done = true;
      el.classList.add('dx-out');
      setTimeout(() => { cancelAnimationFrame(raf); el.remove(); document.documentElement.classList.remove('intro-on'); }, reduce ? 0 : 640);
    };
    el.addEventListener('click', finish);
    if (reduce) { setTimeout(finish, 900); return; }
    const cv = el.querySelector('canvas');
    const ctx = cv && cv.getContext ? cv.getContext('2d') : null;
    if (ctx) {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const W = cv.width = Math.round(window.innerWidth * dpr), H = cv.height = Math.round(window.innerHeight * dpr);
      const cx = W / 2, cy = H / 2 - 44 * dpr, far = Math.hypot(W, H) * 0.6;
      const spawn = s => { s.a = Math.random() * Math.PI * 2; s.r = (6 + Math.random() * 40) * dpr; s.v = (0.7 + Math.random() * 2.4) * dpr; s.w = (0.5 + Math.random() * 1.5) * dpr; return s; };
      const stars = Array.from({ length: 170 }, () => spawn({}));
      // charge: particles spiral in toward the hand sign before the domain opens
      const inward = Array.from({ length: 110 }, () => ({ a: Math.random() * Math.PI * 2, r: (0.45 + Math.random() * 0.75) * far, p: 1.4 + Math.random() * 1.2, w: (0.6 + Math.random() * 1.3) * dpr, sw: 0.5 + Math.random() * 0.9 }));
      const t0 = performance.now();
      const frame = now => {
        const t = (now - t0) / 1000;
        ctx.clearRect(0, 0, W, H);
        ctx.lineCap = 'round';
        if (t < 0.95) {
          const k = Math.min(1, t / 0.92);
          inward.forEach(q => {
            const e = Math.pow(k, q.p), e0 = Math.pow(Math.max(0, k - 0.07), q.p);
            const r = q.r * (1 - e), r0 = q.r * (1 - e0), ang = q.a + e * q.sw, ang0 = q.a + e0 * q.sw;
            ctx.strokeStyle = `rgba(226, 232, 240, ${(Math.min(1, k * 2.5) * (0.2 + 0.7 * e)).toFixed(3)})`;
            ctx.lineWidth = q.w;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(ang0) * r0, cy + Math.sin(ang0) * r0);
            ctx.lineTo(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r);
            ctx.stroke();
          });
        }
        if (t > 0.9) {
          const k = Math.min(1, (t - 0.9) / 0.5);
          stars.forEach(s => {
            const r0 = s.r;
            s.v *= 1.045; s.r += s.v * k;
            ctx.strokeStyle = `rgba(241, 245, 249, ${Math.min(0.95, 0.22 + s.r / far).toFixed(3)})`;
            ctx.lineWidth = s.w;
            ctx.beginPath();
            const tail = Math.max(0, r0 - s.v * 2.2 * k);       // streaks stretch as they speed up
            ctx.moveTo(cx + Math.cos(s.a) * tail, cy + Math.sin(s.a) * tail);
            ctx.lineTo(cx + Math.cos(s.a) * s.r, cy + Math.sin(s.a) * s.r);
            ctx.stroke();
            if (s.r > far * 1.8) spawn(s);
          });
        }
        if (!done) raf = requestAnimationFrame(frame);
      };
      raf = requestAnimationFrame(frame);
    }
    setTimeout(finish, 2750);
  }
  async function boot() {
    playIntro();
    const h = location.hash ? decodeURIComponent(location.hash.slice(1)) : '';
    if (h) view = h;
    const FB = window.VIBEFIT_FIREBASE;
    if (FB) {
      if (!window.firebase) { $('#app').innerHTML = setupView('تعذّر تحميل Firebase', 'تحقق من اتصالك بالإنترنت ثم حدّث الصفحة.'); return; }
      if (!FB.apiKey || /PASTE/.test(FB.apiKey)) { $('#app').innerHTML = setupView('بقيت خطوة واحدة', 'ضع قيمة apiKey من إعدادات مشروع Firebase في أعلى ملف index.html، ثم انشر الملف من جديد.'); return; }
      bootFirebase(FB);
      return;
    }
    const C = window.claude;
    if (!C || typeof C.use !== 'function') { bootLocal(); return; }
    renderApp();                              // loading state while the viewer answers
    let handle = null;
    try { handle = await C.use('db'); } catch (e) { handle = null; }
    if (!handle) { bootLocal(); return; }
    dbh = handle;
    mode = 'shared';
    try {
      const user = await C.use('user');
      if (user) {
        const [cw, own] = await Promise.all([
          user.can('data.write').catch(() => null),
          user.isOwner().catch(() => false)
        ]);
        canWrite = cw;
        readOnly = cw === false;
        isOwnerViewer = !!own;
      }
    } catch (e) { /* no viewer identity: keep inputs, let a refused write decide */ }
    renderApp();
    listen('accounts', () => dbh.collection('accounts'));
    listen('days', () => dbh.collection('days').where('date', '>=', sharedCutoff));
    listenChat();
    initAI();
    setTimeout(() => { if (!sharedReady) { sharedStale = true; renderApp(); } }, 10000);
  }
  boot();
})();
</script>
</body>
